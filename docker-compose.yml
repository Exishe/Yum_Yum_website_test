# Local Postgres for development: `docker compose up -d`
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: yumyum
    ports:
      - "5432:5432"
    volumes:
      - yumyum-db:/var/lib/postgresql/data
volumes:
  yumyum-db:
